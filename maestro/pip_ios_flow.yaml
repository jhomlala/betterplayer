appId: pl.hasoft.example
---
- launchApp
- assertVisible: "Better Player Example"

# Wait for video area
- extendedWaitUntil:
    visible:
      id: "better_player_cupertino_video_area"
    timeout: 10000

# Tap on PiP button
- tapOn:
    id: "better_player_cupertino_controls_pip_button"

- waitForAnimationToEnd:
    timeout: 5000

# Press home button to force the app to background (triggering automatic PiP)
- pressKey: Home

# Assert the existence of the iOS system PiP windows/buttons
# Note: System strings can vary slightly by iOS version, but common ones include:
- assertVisible:
    text: "Pause" # The overlay pause button
- assertVisible:
    text: "Close" # The 'X' button to dismiss the PiP window