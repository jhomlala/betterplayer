appId: pl.hasoft.example
---
- launchApp
- assertVisible: "Better Player Example"

# Start with MP4
- tapOn:
    id: "better_player_e2e_setup_mp4"
- extendedWaitUntil:
    visible:
      id: "better_player_cupertino_video_area"
    timeout: 10000

# Swap to HLS
- tapOn:
    id: "better_player_e2e_setup_hls"
- extendedWaitUntil:
    visible:
      id: "better_player_cupertino_video_area"
    timeout: 15000

# Verify it's playing
- tapOn:
    id: "better_player_cupertino_controls_play_pause_button"
