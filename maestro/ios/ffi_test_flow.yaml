appId: pl.hasoft.example
---
- launchApp
- scrollUntilVisible:
    element:
      id: "better_player_e2e_navigate_ffi"
    direction: DOWN
- tapOn:
    id: "better_player_e2e_navigate_ffi"
- extendedWaitUntil:
    visible:
      id: "ffi_test_initialized_status"
      text: "initialized=true"
    timeout: 60000
- tapOn:
    id: "ffi_test_button_play"
- assertVisible:
    id: "ffi_test_status_play"
    text: "success=true"
- tapOn:
    id: "ffi_test_button_pause"
- assertVisible:
    id: "ffi_test_status_pause"
    text: "success=true"
- tapOn:
    id: "ffi_test_button_seekTo"
- assertVisible:
    id: "ffi_test_status_seekTo"
    text: "success=true"
- tapOn:
    id: "ffi_test_button_setVolume"
- assertVisible:
    id: "ffi_test_status_setVolume"
    text: "success=true"
- tapOn:
    id: "ffi_test_button_setSpeed"
- assertVisible:
    id: "ffi_test_status_setSpeed"
    text: "success=true"
- tapOn:
    id: "ffi_test_button_setTrackParameters"
- assertVisible:
    id: "ffi_test_status_setTrackParameters"
    text: "success=true"
- tapOn:
