appId: pl.hasoft.example
---
- launchApp
- assertVisible: "Better Player Example"

# Tap the player area to ensure controls are visible
- tapOn:
    id: "better_player_cupertino_video_area"

# Basic playback control
- tapOn:
    id: "better_player_cupertino_controls_play_pause_button"

# Volume control
- tapOn:
    id: "better_player_cupertino_controls_mute_button"
- tapOn:
    id: "better_player_cupertino_controls_mute_button"

# Overflow menu
- tapOn:
    id: "better_player_cupertino_controls_more_button"

# Assert that the menu is visible using semantic ID
- assertVisible:
    id: "better_player_overflow_menu_quality"
