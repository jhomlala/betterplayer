appId: pl.hasoft.example
---
- launchApp
- assertVisible: "Better Player Example"
- tapOn: "Open Full Showcase"
- scrollUntilVisible:
    element: "Basic player"
- tapOn: "Basic player"
- assertVisible: "Basic player"
# Tap the player area to show controls
- tapOn: "Video player"
- tapOn: "Play"
- tapOn: "Video player"
- tapOn: "Mute"
- tapOn: "Video player"
- tapOn: "Unmute"
- tapOn: "Video player"
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Playback speed"
    timeout: 10000
- tapOn: "Playback speed"
- tapOn: "2.0 x"
- tapOn: "Video player"
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Quality"
    timeout: 10000
- tapOn: "Quality"
- tapOn: "Auto"
