appId: pl.hasoft.example
---
- launchApp
- scrollUntilVisible:
    element:
      id: "better_player_e2e_navigate_ffi"
    direction: DOWN

- tapOn:
    id: "better_player_e2e_navigate_ffi"
- extendedWaitUntil:
    visible:
      id: "ffi_test_initialized_status"
      text: ".*initialized=true.*"
    timeout: 60000

- scrollUntilVisible:
    element:
      id: "ffi_test_status_play"
    direction: DOWN

- tapOn:
    id: "ffi_test_button_play"
- assertVisible:
    id: "ffi_test_status_play"
    text: ".*success=true.*"

- scrollUntilVisible:
