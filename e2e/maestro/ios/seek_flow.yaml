appId: pl.hasoft.example
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_app_bar_title"
    timeout: 60000
- assertVisible:
    id: "better_player_e2e_app_bar_title"

# Navigate to Seek E2E page
- scrollUntilVisible:
    element:
      id: "better_player_e2e_navigate_seek"
    direction: DOWN
- tapOn:
    id: "better_player_e2e_navigate_seek"

# Wait for seek player initialization
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_seek_initialized"
    timeout: 30000
- assertVisible:
    id: "better_player_e2e_seek_initialized"

# Tap Seek 00:10 button
- tapOn:
    id: "better_player_e2e_seek_10s_button"

# Wait for seek 10s status to be verified
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_seek_10s_verified"
    timeout: 20000
- assertVisible:
    id: "better_player_e2e_seek_10s_verified"
