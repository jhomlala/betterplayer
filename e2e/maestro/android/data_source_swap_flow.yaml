appId: pl.hasoft.example
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_app_bar_title"
    timeout: 60000
- assertVisible:
    id: "better_player_e2e_app_bar_title"

# Start with MP4
- tapOn:
    id: "better_player_e2e_setup_mp4"
- extendedWaitUntil:
    visible:
      id: "better_player_material_controls_play_pause_button"
    timeout: 10000

# Swap to HLS
- tapOn:
    id: "better_player_e2e_setup_hls"
- extendedWaitUntil:
    visible:
      id: "better_player_material_controls_play_pause_button"
    timeout: 15000

# Verify it's playing
- tapOn:
    id: "better_player_material_controls_play_pause_button"

# Swap back to MP4 and verify visibility callback (#939)
- tapOn:
    id: "better_player_e2e_setup_mp4"
- extendedWaitUntil:
    visible:
      id: "better_player_material_controls_play_pause_button"
    timeout: 15000
- tapOn:
    id: "better_player_e2e_visibility_cycle_button"
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_visibility_callback_status"
    timeout: 5000
- assertVisible:
    id: "better_player_e2e_visibility_callback_status"

# Verify BetterPlayerPlaylist transition (#1037)
- tapOn:
    id: "better_player_e2e_playlist_button"
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_playlist_status"
    timeout: 10000
- assertVisible:
    id: "better_player_e2e_playlist_status"

