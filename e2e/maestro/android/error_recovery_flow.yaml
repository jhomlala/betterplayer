appId: pl.hasoft.example
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_app_bar_title"
    timeout: 60000
- assertVisible:
    id: "better_player_e2e_app_bar_title"

# Trigger an invalid/error state
- tapOn:
    id: "better_player_e2e_setup_error"
# We will use the existing UI to check for error state
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_error_text"
    timeout: 10000
- assertVisible:
    id: "better_player_e2e_error_text"

# Recover from error by setting valid MP4 data source
- tapOn:
    id: "better_player_e2e_setup_mp4"
- extendedWaitUntil:
    notVisible:
      id: "better_player_e2e_error_text"
    timeout: 10000
- assertNotVisible:
    id: "better_player_e2e_error_text"
- extendedWaitUntil:
    visible:
      id: "better_player_material_controls_play_pause_button"
    timeout: 15000
- tapOn:
    id: "better_player_material_controls_play_pause_button"

# Navigate to Seek E2E Page and verify accurate seek position (#1342, #1068, #802)
- scrollUntilVisible:
    element:
      id: "better_player_e2e_navigate_seek"
    direction: DOWN
- tapOn:
    id: "better_player_e2e_navigate_seek"
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_seek_initialized"
    timeout: 20000
- tapOn:
    id: "better_player_e2e_seek_10s_button"
- extendedWaitUntil:
    visible:
      id: "better_player_e2e_seek_10s_verified"
    timeout: 10000
- assertVisible:
    id: "better_player_e2e_seek_10s_verified"

