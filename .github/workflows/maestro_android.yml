name: Maestro Android flow

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_CLI_NO_ANALYTICS: 1

jobs:
  maestro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [30]
    steps:
      - uses: actions/checkout@v4
        with:
          path: better_player

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Maestro
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro
          restore-keys: |
            ${{ runner.os }}-maestro-

      - name: Install Maestro
        run: |
          if [ ! -d "$HOME/.maestro/bin" ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ runner.os }}

      - name: Setup Android SDK and Emulator
        run: |
          # Ensure KVM permissions
          sudo chmod 666 /dev/kvm
          
          # Install system image
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-${{ matrix.api-level }};google_atd;x86_64"
          
          # Create AVD if not exists
          if [ ! -f "$HOME/.android/avd/test.avd/config.ini" ]; then
            echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test -k "system-images;android-${{ matrix.api-level }};google_atd;x86_64" --force --device "pixel"
          fi

      - name: Launch Emulator and Build App
        run: |
          # Launch emulator in background with more RAM and stable GPU
          $ANDROID_HOME/emulator/emulator -avd test -no-window -gpu swiftshader -noaudio -no-boot-anim -accel on -memory 3072 -no-snapshot-save &
          EMU_PID=$!
          
          # Start build in background
          cd better_player/example && flutter build apk --debug --target lib/main_e2e.dart &
          BUILD_PID=$!
          
          # Pass PIDs to the script
          export BUILD_PID=$BUILD_PID
          export EMU_PID=$EMU_PID
          
          # Return to root and run the sync script
          cd ../..
          bash better_player/maestro/android/ci_build_and_test.sh

      - name: Upload Maestro Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-debug-artifacts
          path: ~/.maestro/tests/
