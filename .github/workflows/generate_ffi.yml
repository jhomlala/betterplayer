name: Generate FFI Bindings

on:
  push:
    branches:
      - 'feature/ffi-migration'
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  generate:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android Dependencies
        working-directory: packages/better_player_android
        run: |
          flutter pub get
          flutter create --platforms=android example
          cd example
          # Inject path dependency to the plugin so it actually compiles!
          sed -i.bak '/dependencies:/a\
            better_player_android:\
              path: ..' pubspec.yaml
          
          flutter pub get
          flutter build apk --debug

      - name: Generate Android FFI (jnigen)
        working-directory: packages/better_player_android
        run: dart run tool/jnigen.dart

      - name: Install iOS Dependencies
        working-directory: packages/better_player_ios
        run: flutter pub get

      - name: Generate iOS FFI (swiftgen)
        working-directory: packages/better_player_ios
        run: dart run tool/swiftgen.dart

      - name: Commit Generated Bindings
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Generate Android and iOS FFI bindings"
          file_pattern: "packages/better_player_android/lib/src/*.dart packages/better_player_ios/lib/src/*.dart packages/better_player_ios/ios/better_player_ios/Sources/better_player_ios_objc/*.m"
          branch: ${{ github.ref }}
