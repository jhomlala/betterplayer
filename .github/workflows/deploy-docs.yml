name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web demo
        working-directory: packages/better_player_example
        run: >
          flutter build web
          --release
          --target lib/main.dart
          --base-href "/betterplayer/demo/"
          --no-tree-shake-icons

      - name: Build Docusaurus website
        run: npm run build

      - name: Merge demo into docs output
        run: |
          mkdir -p docs/build/demo
          cp -r packages/better_player_example/build/web/. docs/build/demo/

      - name: Disable Jekyll
        run: touch ./docs/build/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build


