name: Web Tests Debug

on:
  workflow_dispatch:
  push:
    branches:
      - feat/better-player-web-tets

jobs:
  run-web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash'
          cache-path: '${{ runner.tool_cache }}/flutter'

      - name: Install dependencies
        run: |
          flutter pub get
          cd packages/better_player_web && flutter pub get

      - name: Run Web Tests (flutter run)
        run: |
          cd packages/better_player_web
          # Ensure minimal web directory exists for compilation
          mkdir -p web
          echo '<!DOCTYPE html><html><body><script src="main.dart.js"></script></body></html>' > web/index.html
          
          # Install and use xvfb to provide a virtual display for Chrome
          sudo apt-get update && sudo apt-get install -y xvfb
          
          # Run in background and pipe logs
          xvfb-run --auto-servernum flutter run -d chrome test/all_tests.dart --no-pub > tests.log 2>&1 &
          RUN_PID=$!
          echo "Flutter run started with PID $RUN_PID"
          
          # Periodically print logs to console for 3 minutes
          # We check for a completion marker to close the app early
          for i in {1..36}; do
            if [ -f tests.log ]; then
              # Print only new lines since last check
              if [ ! -f last_pos ]; then echo 0 > last_pos; fi
              LAST_POS=$(cat last_pos)
              NEW_LINES=$(tail -n +$((LAST_POS + 1)) tests.log)
              echo "$NEW_LINES"
              echo $((LAST_POS + $(echo "$NEW_LINES" | grep -c '^' || echo 0))) > last_pos
              
              if grep -q "=== WEB TESTS COMPLETED ===" tests.log; then
                echo "Tests finished detected. Closing app..."
                break
              fi
              
              if grep -q "Some tests failed." tests.log; then
                echo "Tests failure detected. Closing app..."
                # We don't exit 1 yet, we want to see the full logs and kill the process gracefully
                break
              fi
            fi
            sleep 5
          done
          
          echo "Cleaning up..."
          kill $RUN_PID || true
          
          # Check for failures in the final log to set job status
          if grep -q "Some tests failed." tests.log; then
            exit 1
          fi
