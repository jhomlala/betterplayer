name: Web Tests Debug

on:
  workflow_dispatch:
  push:
    branches:
      - feat/better-player-web-tets

jobs:
  run-web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd packages/better_player_web && flutter pub get

      - name: Run Web Tests (flutter run)
        run: |
          cd packages/better_player_web
          # Ensure minimal web directory exists for compilation
          mkdir -p web
          echo '<!DOCTYPE html><html><body><script src="main.dart.js"></script></body></html>' > web/index.html
          
          # Install and use xvfb to provide a virtual display for Chrome
          sudo apt-get update && sudo apt-get install -y xvfb
          
          # Run in background and pipe logs
          xvfb-run --auto-servernum flutter run -d chrome test/all_tests.dart --no-pub > tests.log 2>&1 &
          RUN_PID=$!
          echo "Flutter run started with PID $RUN_PID"
          
          # Periodically print logs to console for 3 minutes
          for i in {1..36}; do
            if [ -f tests.log ]; then
              cat tests.log
              # Clear log after printing to avoid duplicates in next iteration
              > tests.log
            fi
            sleep 5
          done
          
          kill $RUN_PID || true
