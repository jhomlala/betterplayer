name: Web Tests Debug

on:
  workflow_dispatch:
  push:
    branches:
      - feat/better-player-web-tets

jobs:
  run-web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash'
          cache-path: '${{ runner.tool_cache }}/flutter'

      - name: Install dependencies
        run: |
          flutter pub get
          cd packages/better_player_web && flutter pub get

      - name: Run Web Tests (flutter run)
        run: |
          cd packages/better_player_web
          # Ensure minimal web directory exists for compilation
          mkdir -p web
          echo '<!DOCTYPE html><html><body><script src="main.dart.js"></script></body></html>' > web/index.html
          
          # Install and use xvfb to provide a virtual display for Chrome
          sudo apt-get update && sudo apt-get install -y xvfb
          
          # Run directly. The app will attempt to close itself after tests.
          # We use a timeout as a safety net to prevent hanging forever in case window.close() fails.
          xvfb-run --auto-servernum timeout 300 flutter run -d chrome test/all_tests.dart --no-pub
