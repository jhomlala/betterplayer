name: Quality Gate

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze .

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install LCOV
        run: brew install lcov

      - name: Run tests
        run: |
          for dir in packages/*; do
            if [ -d "$dir/test" ]; then
              echo "Testing $dir..."
              (cd "$dir" && flutter test --coverage)
            fi
          done

      - name: Generate HTML Report
        run: |
          LCOV_FILES=$(find packages -name lcov.info)
          if [ -n "$LCOV_FILES" ]; then
            genhtml $LCOV_FILES --output-directory coverage/html
            mkdir -p coverage
            # Concatenate all lcov.info files into one for subsequent steps
            for f in $LCOV_FILES; do
              # Add package prefix to file paths in lcov.info
              pkg_dir=$(dirname $(dirname $f))
              perl -pi -e "s|SF:lib/|SF:$pkg_dir/lib/|g" $f
              cat "$f" >> coverage/lcov.info
            done
          else
            echo "No coverage info found."
            mkdir -p coverage/html
          fi

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: coverage/html

      - name: Add Coverage Summary to Workflow Output
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          lcov --summary coverage/lcov.info | grep -E 'lines|functions|branches' | sed 's/^  //' | awk -F': ' '{print "| " $1 " | " $2 " |"}' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
