name: E2E Tizen (Build & Integration Tests)

on:
  push:
    paths:
      - 'packages/better_player_tizen/**'
      - '.github/workflows/e2e_tizen.yml'
  pull_request:
    paths:
      - 'packages/better_player_tizen/**'
      - '.github/workflows/e2e_tizen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tizen:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libncurses5 python3.8 libpython3.8 gettext \
            libkf5itemmodels5 libkf5kiowidgets5 libkchart2 \
            dbus-x11 gnome-keyring xvfb libgl1-mesa-glx

      - name: Install Tizen Studio CLI
        run: |
          curl -sS https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin -o install.bin
          chmod a+x install.bin
          ./install.bin --accept-license $HOME/tizen-studio
          rm install.bin

      - name: Install Tizen Studio Packages
        run: |
          $HOME/tizen-studio/package-manager/package-manager-cli.bin install \
            NativeToolchain-Gcc-9.2 \
            IOT-Headed-6.0-NativeAppDevelopment-CLI \
            Certificate-Manager \
            NativeCLI

      - name: Create Tizen Certificate Profile
        run: |
          export PATH=$PATH:$HOME/tizen-studio/tools/ide/bin
          dbus-run-session -- bash -c "
          echo tizen | gnome-keyring-daemon --unlock &&
          tizen certificate -a tizen -p tizen -f tizen
          tizen security-profiles add \
            -n tizen \
            -a $HOME/tizen-studio-data/keystore/author/tizen.p12 \
            -p tizen
          "

      - name: Install flutter-tizen
        run: |
          git clone --depth 1 https://github.com/flutter-tizen/flutter-tizen.git $HOME/flutter-tizen
          echo "$HOME/flutter-tizen/bin" >> $GITHUB_PATH

      - name: Pre-cache Tizen Engine Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENGINE_VER=$(cut -c1-8 "$HOME/flutter-tizen/bin/internal/engine.version")
          FULL_VER=$(cat "$HOME/flutter-tizen/bin/internal/engine.version")
          echo "Flutter Tizen Engine revision: $ENGINE_VER ($FULL_VER)"
          
          # Initialize flutter-tizen to clone internal flutter repo
          export PATH="$HOME/flutter-tizen/bin:$PATH"
          flutter-tizen --version
          
          RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/flutter-tizen/flutter/releases/tags/$ENGINE_VER")
          CACHE_DIRS=(
            "$HOME/flutter-tizen/bin/cache"
            "$HOME/flutter-tizen/flutter/bin/cache"
          )
          
          for pkg in tizen-arm-debug tizen-arm64-debug tizen-x86-debug; do
            URL=$(echo "$RELEASE_JSON" | jq -r ".assets[] | select(.name==\"$pkg.zip\") | .url")
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              echo "Downloading $pkg via GitHub API..."
              curl -s -L \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "$URL" -o "/tmp/$pkg.zip"
              for cdir in "${CACHE_DIRS[@]}"; do
                target="$cdir/artifacts/engine/$pkg"
                mkdir -p "$target"
                unzip -q -o "/tmp/$pkg.zip" -d "$target"
                chmod -R a+x "$target"
              done
            fi
          done
          
          for cdir in "${CACHE_DIRS[@]}"; do
            mkdir -p "$cdir"
            echo "$FULL_VER" > "$cdir/tizen-engine.stamp"
          done
          
          echo "Tizen engine pre-cache complete:"
          ls -la "$HOME/flutter-tizen/flutter/bin/cache/artifacts/engine" || true

      - name: Fetch Workspace Dependencies
        run: flutter pub get

      - name: Run Tizen Unit Tests
        working-directory: packages/better_player_tizen
        run: flutter test --coverage

      - name: Run Example E2E Tests
        working-directory: packages/better_player_tizen/example
        run: flutter test test/example_e2e_test.dart

      - name: Build Tizen TPK Package
        working-directory: packages/better_player_tizen/example
        run: |
          export PATH="$HOME/flutter-tizen/bin:$HOME/tizen-studio/tools/ide/bin:$PATH"
          export FLUTTER_ROOT="$HOME/flutter-tizen/flutter"
          dbus-run-session -- bash -c "
            echo tizen | gnome-keyring-daemon --unlock &&
            for attempt in 1 2 3; do
              echo \"=== Attempt \$attempt: Building TPK ===\"
              if flutter-tizen build tpk --debug -v; then
                echo \"=== TPK build succeeded on attempt \$attempt ===\"
                exit 0
              fi
              echo \"=== TPK build failed on attempt \$attempt, retrying in 5 seconds... ===\"
              sleep 5
            done
            exit 1
          "

      - name: Upload Tizen TPK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tizen-debug-tpk
          path: packages/better_player_tizen/example/build/tizen/tpk/*.tpk
          if-no-files-found: ignore
