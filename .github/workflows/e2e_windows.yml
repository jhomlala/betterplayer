name: E2E Windows (Integration Tests)

on:
  push:
    paths:
      - 'packages/better_player/**'
      - 'packages/better_player_windows/**'
      - 'packages/better_player_platform_interface/**'
      - 'packages/better_player_example/**'
      - '.github/workflows/e2e_windows.yml'
  pull_request:
    paths:
      - 'packages/better_player/**'
      - 'packages/better_player_windows/**'
      - 'packages/better_player_platform_interface/**'
      - 'packages/better_player_example/**'
      - '.github/workflows/e2e_windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Get Workspace Dependencies
        run: flutter pub get

      - name: Download and setup libmpv
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*v3*" -and $_.name -notlike "*lgpl*" } | Select-Object -First 1
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mpv-dev.7z"
          New-Item -ItemType Directory -Force -Path "packages/better_player_windows/windows/libs"
          7z e mpv-dev.7z -o"packages/better_player_windows/windows/libs" *.dll -r -y
          if (Test-Path "packages/better_player_windows/windows/libs/libmpv-2.dll") {
            Copy-Item "packages/better_player_windows/windows/libs/libmpv-2.dll" "packages/better_player_windows/windows/libs/mpv-2.dll" -Force
          }
          Copy-Item "packages/better_player_windows/windows/libs/*mpv*.dll" "C:\Windows\System32\" -Force

      - name: Run Windows Integration Tests
        working-directory: packages/better_player_example
        run: flutter test integration_test/windows_all_tests.dart -d windows --no-pub
