name: Maestro iOS flow

on:
  push:
    branches: [ master, 'refactor/maestro-*', 'feat/maestro-*' ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: better_player

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Maestro
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro
          restore-keys: |
            ${{ runner.os }}-maestro-

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            better_player/example/ios/.swiftpm
            better_player/example/ios/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('better_player/ios/better_player/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install dependencies
        run: |
          cd better_player
          flutter pub get
          cd example
          flutter pub get

      - name: Enable Swift Package Manager
        run: |
          cd better_player
          flutter config --enable-swift-package-manager

      - name: Install Maestro
        run: |
          if [ ! -d "$HOME/.maestro/bin" ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Start Simulator Boot
        run: |
          # Use the first available iPhone simulator
          DEVICE_UUID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | awk -F '[()]' '{print $2}')
          if [ -z "$DEVICE_UUID" ]; then
            echo "No iPhone simulator found"
            exit 1
          fi
          echo "DEVICE_UUID=$DEVICE_UUID" >> $GITHUB_ENV
          echo "Booting device $DEVICE_UUID in background"
          xcrun simctl boot $DEVICE_UUID

      - name: Build Example App
        run: |
          cd better_player/example
          flutter build ios --simulator --debug --no-codesign --target lib/main_e2e.dart

      - name: Wait for Simulator Boot
        run: |
          echo "Waiting for device $DEVICE_UUID to boot..."
          xcrun simctl bootstatus $DEVICE_UUID -b

      - name: Install App
        run: |
          # Path for Flutter debug simulator builds
          APP_PATH="better_player/example/build/ios/iphonesimulator/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            ls -R better_player/example/build/ios/
            exit 1
          fi
          xcrun simctl install booted "$APP_PATH"

      - name: Run Maestro
        run: |
          cd better_player
          maestro test maestro/

      - name: Upload Maestro Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-artifacts
          path: ~/.maestro/tests/
