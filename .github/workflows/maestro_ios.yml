name: Maestro iOS flow

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000

jobs:
  maestro:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: better_player

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Maestro
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro
          restore-keys: |
            ${{ runner.os }}-maestro-

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            better_player/packages/better_player_example/ios/.swiftpm
            better_player/packages/better_player_example/ios/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('better_player/packages/better_player_ios/ios/better_player_ios.podspec') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install dependencies
        run: |
          cd better_player
          flutter pub get
          cd packages/better_player_example
          flutter pub get

      - name: Enable Swift Package Manager
        run: |
          cd better_player
          flutter config --enable-swift-package-manager

      - name: Install Maestro
        run: |
          if [ ! -d "$HOME/.maestro/bin" ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Start Simulator Boot
        run: |
          # Disable macOS application firewall to prevent network socket drops
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off || true

          # Unlock keychain to prevent trustd evaluation hangs
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true

          # Block outbound UDP 443 to force fallback from unstable QUIC/HTTP3 to standard TCP TLS
          echo "block return out proto udp from any to any port 443" | cat /etc/pf.conf - | sudo pfctl -Ef - || true

          # Use the first available iPhone simulator
          DEVICE_UUID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | awk -F '[()]' '{print $2}')
          if [ -z "$DEVICE_UUID" ]; then
            echo "No iPhone simulator found"
            exit 1
          fi
          echo "DEVICE_UUID=$DEVICE_UUID" >> $GITHUB_ENV

          # Erase stale simulator state before booting
          xcrun simctl shutdown $DEVICE_UUID || true
          xcrun simctl erase $DEVICE_UUID || true

          echo "Booting device $DEVICE_UUID in background"
          xcrun simctl boot $DEVICE_UUID

      - name: Build Example App
        run: |
          cd better_player/packages/better_player_example
          flutter build ios --simulator --debug --no-codesign --target lib/main_e2e.dart

      - name: Wait for Simulator Boot
        run: |
          echo "Waiting for device $DEVICE_UUID to boot..."
          xcrun simctl bootstatus $DEVICE_UUID -b
          xcrun simctl spawn booted defaults write com.apple.CFNetwork CFNetworkDisableHTTP3 -bool true || true

          echo "Verifying simulator network readiness..."
          for i in {1..15}; do
            if xcrun simctl spawn booted curl -sI https://cdn.jsdelivr.net/npm/big-buck-bunny-1080p@0.0.6/video.mp4 | grep -q "HTTP"; then
              echo "Simulator network is ready"
              break
            fi
            echo "Waiting for simulator network stack ($i/15)..."
            sleep 2
          done

      - name: Install App
        run: |
          # Path for Flutter debug simulator builds
          APP_PATH="better_player/packages/better_player_example/build/ios/iphonesimulator/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            ls -R better_player/packages/better_player_example/build/ios/
            exit 1
          fi
          xcrun simctl install booted "$APP_PATH"

      - name: Run Maestro
        run: |
          cd better_player
          maestro test e2e/maestro/ios/

      - name: Check video frames are not black (#1632)
        run: |
          cd better_player
          dart scripts/check_video_frame.dart feed_render_item_0.png feed_render_item_1.png

      - name: Upload Maestro Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-debug-artifacts
          path: |
            ~/.maestro/tests/
            better_player/feed_render_item_*.png
