name: Generate Android FFI

on:
  push:
    paths:
      - 'packages/better_player_android/android/**'
      - 'packages/better_player_android/tool/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-android-ffi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android Dependencies
        working-directory: packages/better_player_android
        run: |
          # Pre-fetch Gradle 9.5.0 distribution to bypass transient 504 on services.gradle.org
          GRADLE_DIR="$HOME/.gradle/wrapper/dists/gradle-9.5.0-all/aca6g93cdtcf0oapcfka748qh"
          mkdir -p "$GRADLE_DIR"
          if [ ! -f "$GRADLE_DIR/gradle-9.5.0-all.zip.ok" ]; then
            echo "Pre-fetching Gradle 9.5.0..."
            curl -sL "https://mirrors.cloud.tencent.com/gradle/gradle-9.5.0-all.zip" -o "$GRADLE_DIR/gradle-9.5.0-all.zip" || \
            curl -sL "https://repo.huaweicloud.com/gradle/gradle-9.5.0-all.zip" -o "$GRADLE_DIR/gradle-9.5.0-all.zip"
            unzip -q -o "$GRADLE_DIR/gradle-9.5.0-all.zip" -d "$GRADLE_DIR"
            touch "$GRADLE_DIR/gradle-9.5.0-all.zip.ok"
          fi

          flutter pub get
          cd example_ffi
          flutter pub get

          # Monkey-patch jnigen to support the latest Kotlin metadata format
          find ~/.pub-cache/hosted -path "*/jnigen*/java/build.gradle.kts" -exec sed -i.bak 's/kotlin-metadata-jvm:2.2.0/kotlin-metadata-jvm:2.+/' {} +
          flutter build apk --debug

      - name: Generate Android FFI (jnigen)
        working-directory: packages/better_player_android
        run: dart run tool/jnigen.dart

      - name: Rebase onto latest remote changes
        run: |
          git stash --include-untracked
          git pull origin ${{ github.head_ref || github.ref_name }} --rebase
          git stash pop || true

      - name: Commit Generated Bindings
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Generate Android FFI bindings"
          file_pattern: "packages/better_player_android/lib/src/*.dart"
          branch: ${{ github.head_ref || github.ref_name }}
