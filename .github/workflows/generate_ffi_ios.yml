name: Generate iOS FFI

on:
  push:
    branches:
      - '**'
      - '!master'
    paths:
      - 'packages/better_player_ios/ios/**'
      - 'packages/better_player_ios/tool/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffi-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-ios-ffi:
    if: github.ref != 'refs/heads/master' && startsWith(github.ref, 'refs/heads/')
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install iOS Dependencies
        working-directory: packages/better_player_ios
        run: flutter pub get

      - name: Generate iOS FFI (swiftgen)
        working-directory: packages/better_player_ios
        run: dart run tool/swiftgen.dart

      - name: Rebase onto latest remote changes
        run: |
          git stash --include-untracked
          git pull origin ${{ github.head_ref || github.ref_name }} --rebase
          git stash pop || true

      - name: Commit Generated Bindings
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Generate iOS FFI bindings"
          file_pattern: "packages/better_player_ios/lib/src/*.dart packages/better_player_ios/ios/better_player_ios/Sources/better_player_ios_objc/*.m"
          branch: ${{ github.head_ref || github.ref_name }}
