name: better_player_tizen
resolution: workspace
description: The Tizen implementation of the better_player plugin, providing video playback for Samsung Smart TVs and Tizen devices.
version: 1.0.0
homepage: https://github.com/jhomlala/betterplayer/tree/master/packages/better_player_tizen
documentation: https://jhomlala.github.io/betterplayer/
topics:
  - video
  - video-player
  - tizen
  - streaming

environment:
  sdk: "^3.12.0"
  flutter: ">=3.47.0"

dependencies:
  better_player_platform_interface: ^1.7.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    implements: better_player
    platforms:
      tizen:
        pluginClass: BetterPlayerTizenPlugin
        fileName: better_player_tizen_plugin.h
        dartPluginClass: BetterPlayerTizen
