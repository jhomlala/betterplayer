name: better_player_macos
resolution: workspace
description: macOS implementation of the better_player plugin.
version: 1.0.0
homepage: https://github.com/jhomlala/betterplayer

environment:
  sdk: "^3.12.0"
  flutter: ">=3.47.0"

dependencies:
  better_player_platform_interface: ^1.3.3
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  objective_c: ^9.0.0

dev_dependencies:
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  logging: ^1.3.0
  mocktail: ^1.0.4
  swiftgen: ^0.1.0
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    implements: better_player
    platforms:
      macos:
        pluginClass: BetterPlayerPlugin
        dartPluginClass: BetterPlayerMacOS
