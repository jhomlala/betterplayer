name: better_player_windows
resolution: workspace
description: The Windows implementation of the better_player plugin, providing video playback using libmpv and FFI for Flutter desktop apps.
version: 1.0.0
homepage: https://github.com/jhomlala/betterplayer/tree/master/packages/better_player_windows
topics:
  - video
  - player
  - windows
  - libmpv
  - streaming

environment:
  sdk: "^3.12.0"
  flutter: ">=3.47.0"

dependencies:
  better_player_platform_interface: ^1.3.3
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    implements: better_player
    platforms:
      windows:
        pluginClass: BetterPlayerWindowsPlugin
        dartPluginClass: BetterPlayerWindows
