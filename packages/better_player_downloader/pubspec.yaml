name: better_player_downloader
resolution: workspace
description: Android plugin for better_player that downloads DASH and HLS streams for offline playback.
version: 1.0.0
homepage: https://github.com/jhomlala/betterplayer/tree/master/packages/better_player_downloader
documentation: https://jhomlala.github.io/betterplayer/
topics:
  - video
  - download
  - dash
  - hls
  - offline

environment:
  sdk: "^3.12.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    platforms:
      android:
        package: pl.hasoft.better_player_downloader
        pluginClass: BetterPlayerDownloaderPlugin
