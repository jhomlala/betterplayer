name: better_player
resolution: workspace
description: Advanced video player for Flutter with HLS, DASH, DRM, subtitles, caching, PiP, playlists, and custom controls.
version: 1.29.0
homepage: https://github.com/jhomlala/betterplayer/tree/master/packages/better_player
documentation: https://jhomlala.github.io/betterplayer/
topics:
  - video
  - player
  - media
  - streaming
  - hls

screenshots:
  - description: 'Better Player logo'
    path: assets/logo.png
  - description: 'Overview on web and desktop'
    path: assets/screenshots/web_01_overview_dark.png
  - description: 'Overview on Android'
    path: assets/screenshots/android_01_overview.png
  - description: 'Fullscreen playback on Android'
    path: assets/screenshots/android_04_fullscreen.png
  - description: 'Picture in Picture on Android'
    path: assets/screenshots/android_05_pip.png
  - description: 'Styled subtitles'
    path: assets/screenshots/web_04_subtitles.png
  - description: 'HLS quality switching'
    path: assets/screenshots/web_05_hls_tracks.png

environment:
  sdk: "^3.12.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  better_player_platform_interface: ^1.5.0
  better_player_android: ^1.9.0
  better_player_ios: ^1.9.0
  better_player_macos: ^1.4.1
  better_player_windows: ^1.3.0
  better_player_linux: ^1.0.0
  better_player_web: ^1.3.1
  material_ui: ^1.1.0
  cupertino_ui: ^1.0.1
  cupertino_icons: ^2.0.0
  wakelock_plus: ^1.7.0
  meta: ^1.19.0
  visibility_detector: ^0.4.0+2
  path_provider: ^2.1.6
  collection: ^1.19.1
  xml: ^7.0.1
  http: ^1.2.0

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  very_good_analysis: ^10.3.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: better_player_android
      ios:
        default_package: better_player_ios
      macos:
        default_package: better_player_macos
      windows:
        default_package: better_player_windows
      linux:
        default_package: better_player_linux
      web:
        default_package: better_player_web
