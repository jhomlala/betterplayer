appId: pl.hasoft.example
---
- launchApp:
    clearState: true

# Wait for the main page
- assertVisible: "Better Player Example"

# Navigate to the Seek E2E page
- tapOn: "Seek Test"

# Wait for the Seek page to load and video to start
- assertVisible: "Seek E2E Test"

# Test seeking to 00:03
- tapOn: "Seek 00:03"
- assertVisible: "Position: [3-6]s"

# Test seeking to 00:10
- tapOn: "Seek 00:10"
- assertVisible: "Position: 1[0-3]s"

# Test seeking to 00:30
- tapOn: "Seek 00:30"
- assertVisible: "Position: 3[0-3]s"
