include: package:very_good_analysis/analysis_options.yaml

analyzer:
  strong-mode:
    implicit-dynamic: false
  errors:
    undefined_lint: ignore
    strict_raw_type: ignore
    inference_failure_on_function_return_type: ignore
    non_nullable_equals_parameter: ignore
    unreachable_switch_default: ignore
    unused_import: ignore
    deprecated_member_use: ignore

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    avoid_catches_without_on_clauses: false
    use_setters_to_change_properties: false
    use_if_null_to_convert_nulls_to_bools: false
    document_ignores: false
    one_member_abstracts: false
    missing_whitespace_between_adjacent_strings: false
    close_sinks: true
    sort_constructors_first: false
    avoid_classes_with_only_static_members: false
    avoid_void_async: false
    avoid_positional_boolean_parameters: false
    avoid_function_literals_in_foreach_calls: false
    prefer_constructors_over_static_methods: false
    sort_unnamed_constructors_first: false
    sized_box_for_whitespace: false
    invalid_dependency: false
    library_private_types_in_public_api: false
    unawaited_futures: false
    cascade_invocations: false
    use_named_constants: false
    parameter_assignments: false
    avoid_dynamic_calls: false
    avoid_equals_and_hash_code_on_mutable_classes: false
    inference_failure_on_function_return_type: false
    strict_raw_type: false
    flutter_style_todos: false
    comment_references: false
    prefer_asserts_with_message: false
    prefer_null_aware_method_calls: false
    no_default_cases: false
    unreachable_switch_default: false
    non_nullable_equals_parameter: false
    unused_import: false
    avoid_unnecessary_containers: false
    deprecated_member_use: false
    unnecessary_const: false
    use_build_context_synchronously: false
    sort_pub_dependencies: false
