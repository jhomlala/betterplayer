include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "packages/better_player_ios/lib/src/**/*.g.dart"
    - "packages/better_player_android/lib/src/**/*.g.dart"
    - scripts/**

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    close_sinks: true
