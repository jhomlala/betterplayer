<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Better Player</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link 
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
    title="docsify-darklight-theme"
    type="text/css"
  />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body .app-nav {
      color: #34495e !important;
    }
    .cover {
      color: #34495e !important;
    }

    .cover #better-player .anchor span {
        color: #34495e !important;
    }

    section.cover {
      min-height: 100vh;
      height: auto !important;
      padding: 2em 0.5em;
    }

    section.cover .cover-main {
      z-index: 0;
    }

    section.cover .cover-main img {
      max-width: 250px;
    }

    section.cover .cover-main > .buttons a {
      border-radius: 2rem;
      border: 1px solid var(--theme-color, #42b983);
      box-sizing: border-box;
      color: var(--theme-color, #42b983);
      display: inline-block;
      font-size: 1.05rem;
      letter-spacing: 0.1rem;
      margin: 0.5rem 1rem;
      padding: 0.75em 2rem;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    section.cover .cover-main > .buttons a:last-child {
      background-color: var(--theme-color, #42b983);
      color: #fff;
    }
    section.cover .cover-main > .buttons a:last-child:hover {
      color: inherit;
      opacity: 0.8;
    }
    section.cover .cover-main > .buttons a:hover {
      color: inherit;
    }
    section.cover blockquote > .buttons > a {
      border-bottom: 2px solid var(--theme-color, #42b983);
      transition: color 0.3s;
    }
    section.cover blockquote > .buttons > a:hover {
      color: var(--theme-color, #42b983);
    }

    /* Flexible Alerts styling improvements - Light Mode */
    .markdown-section div.alert.info {
      background-color: #f0f9ff !important;
      border-left-color: #0ea5e9 !important;
      color: #0369a1 !important;
    }
    .markdown-section div.alert.info .title, .markdown-section div.alert.info p {
      color: #0369a1 !important;
    }

    .markdown-section div.alert.tip {
      background-color: #f0fdf4 !important;
      border-left-color: #22c55e !important;
      color: #166534 !important;
    }
    .markdown-section div.alert.tip .title, .markdown-section div.alert.tip p {
      color: #166534 !important;
    }

    .markdown-section div.alert.important {
      background-color: #f5f2ff !important;
      border-left-color: #8250df !important;
      color: #5e35b1 !important;
    }
    .markdown-section div.alert.important .title, .markdown-section div.alert.important p {
      color: #5e35b1 !important;
    }

    .markdown-section div.alert.warning {
      background-color: #fffbeb !important;
      border-left-color: #f59e0b !important;
      color: #a16207 !important;
    }
    .markdown-section div.alert.warning .title, .markdown-section div.alert.warning p {
      color: #a16207 !important;
    }

    .markdown-section div.alert.attention {
      background-color: #fef2f2 !important;
      border-left-color: #ef4444 !important;
      color: #991b1b !important;
    }
    .markdown-section div.alert.attention .title, .markdown-section div.alert.attention p {
      color: #991b1b !important;
    }

    /* Dark mode overrides for alerts */
    body.dark .markdown-section div.alert.info,
    body[data-theme="dark"] .markdown-section div.alert.info,
    .darkmode .markdown-section div.alert.info {
      background-color: rgba(7, 89, 133, 0.2) !important;
      border-left-color: #38bdf8 !important;
      color: #bae6fd !important;
    }
    body.dark .markdown-section div.alert.info .title,
    body.dark .markdown-section div.alert.info p,
    body[data-theme="dark"] .markdown-section div.alert.info .title,
    body[data-theme="dark"] .markdown-section div.alert.info p {
      color: #bae6fd !important;
    }

    body.dark .markdown-section div.alert.tip,
    body[data-theme="dark"] .markdown-section div.alert.tip,
    .darkmode .markdown-section div.alert.tip {
      background-color: rgba(20, 83, 45, 0.2) !important;
      border-left-color: #4ade80 !important;
      color: #bbf7d0 !important;
    }
    body.dark .markdown-section div.alert.tip .title,
    body.dark .markdown-section div.alert.tip p,
    body[data-theme="dark"] .markdown-section div.alert.tip .title,
    body[data-theme="dark"] .markdown-section div.alert.tip p {
      color: #bbf7d0 !important;
    }

    body.dark .markdown-section div.alert.important,
    body[data-theme="dark"] .markdown-section div.alert.important,
    .darkmode .markdown-section div.alert.important {
      background-color: rgba(130, 80, 223, 0.15) !important;
      border-left-color: #a371f7 !important;
      color: #d2a8ff !important;
    }
    body.dark .markdown-section div.alert.important .title,
    body.dark .markdown-section div.alert.important p,
    body[data-theme="dark"] .markdown-section div.alert.important .title,
    body[data-theme="dark"] .markdown-section div.alert.important p {
      color: #d2a8ff !important;
    }

    body.dark .markdown-section div.alert.warning,
    body[data-theme="dark"] .markdown-section div.alert.warning,
    .darkmode .markdown-section div.alert.warning {
      background-color: rgba(120, 53, 15, 0.2) !important;
      border-left-color: #fbbf24 !important;
      color: #fde68a !important;
    }
    body.dark .markdown-section div.alert.warning .title,
    body.dark .markdown-section div.alert.warning p,
    body[data-theme="dark"] .markdown-section div.alert.warning .title,
    body[data-theme="dark"] .markdown-section div.alert.warning p {
      color: #fde68a !important;
    }

    body.dark .markdown-section div.alert.attention,
    body[data-theme="dark"] .markdown-section div.alert.attention,
    .darkmode .markdown-section div.alert.attention {
      background-color: rgba(127, 29, 29, 0.2) !important;
      border-left-color: #f87171 !important;
      color: #fecaca !important;
    }
    body.dark .markdown-section div.alert.attention .title,
    body.dark .markdown-section div.alert.attention p,
    body[data-theme="dark"] .markdown-section div.alert.attention .title,
    body[data-theme="dark"] .markdown-section div.alert.attention p {
      color: #fecaca !important;
    }
  </style>

</head>
<body>
  <div id="app">Please wait...</div>
  <script>
    window.$docsify = {
      name: 'Better Player',
      repo: "https://github.com/jhomlala/betterplayer/",
      homepage: "home.md",
      loadSidebar: true,
      coverpage: true,
      search: {
          paths: "auto",
          placeholder: "Search",
          noData: "No Results.",
          depth: 6,
        },
        darklightTheme: {
          defaultTheme: "light",
        },
        'flexible-alerts': {
          style: 'flat',
          note: {
            label: 'Note',
            icon: 'fas fa-info-circle',
            className: 'info'
          },
          tip: {
            label: 'Tip',
            icon: 'fas fa-lightbulb',
            className: 'tip'
          },
          warning: {
            label: 'Warning',
            icon: 'fas fa-exclamation-triangle',
            className: 'warning'
          },
          attention: {
            label: 'Attention',
            icon: 'fas fa-exclamation-circle',
            className: 'attention'
          },
          important: {
            label: 'Important',
            icon: 'fas fa-exclamation-circle',
            className: 'important'
          }
        }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//unpkg.com/prismjs/components/prism-dart.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-yaml.min.js"></script>
  <script src="//unpkg.com/docsify/lib/plugins/search.min.js"></script>
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
  <script
    src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"
    type="text/javascript">
</script>
</body>
</html>
